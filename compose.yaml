services:
    postgres:
        image: postgres:18.6-alpine3.23
        environment:
            POSTGRES_DB: connections
            POSTGRES_USER: connections
            POSTGRES_PASSWORD: connections
        ports: ["5432:5432"]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U connections"]
            interval: 5s
            timeout: 3s
            retries: 10
