spring:
    application:
        name: connection-service
    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/connections}
        username: ${DATABASE_USER:connections}
        password: ${DATABASE_PASSWORD:connections}

connection:
    oauth:
        session-ttl: 10m
    google:
        enabled: ${GOOGLE_OAUTH_ENABLED:false}
        authorization-url: https://accounts.google.com/o/oauth2/v2/auth
        token-url: https://oauth2.googleapis.com/token
        user-info-url: https://openidconnect.googleapis.com/v1/userinfo
        revoke-url: https://oauth2.googleapis.com/revoke
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
        scopes:
            - openid
            - https://www.googleapis.com/auth/calendar.events

auth:
    issuer: ${OIDC_ISSUER}
    jwks-url: ${OIDC_JWKS_URL}
    audience: ${OIDC_AUDIENCE:connection-service}
    internal:
        clients: ${OIDC_INTERNAL_CLIENTS:}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        health:
            probes:
                enabled: true
